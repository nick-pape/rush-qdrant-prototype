[package]
name = "rush-qdrant"
version = "0.1.0"
edition = "2024"

[dependencies]
# CLI
clap = { version = "4.5.23", features = ["derive"] }

# File system
walkdir = "2.5.0"

# Serialization
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"

# HTTP
reqwest = { version = "0.12", features = ["json", "blocking"] }
urlencoding = "2"

# Utilities
anyhow = "1.0.93"
twox-hash = "1.6"
shellexpand = "3.0"
sha2 = "0.10"

# Tree-sitter for AST parsing
tree-sitter = "0.22"
tree-sitter-typescript = "0.21"
rand = "0.9"

# File watching
notify = "7"

[dev-dependencies]
insta = { version = "1.34", features = ["yaml"] }
